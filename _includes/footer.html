<footer class="site-footer">
  <div class="site-footer__social">
    {% for item in site.data.social %}<a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">[{{ item.name }}]</a>{% unless forloop.last %} {% endunless %}{% endfor %}
  </div>
  <div class="site-footer__meta">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.author }} &mdash; built with Jekyll</span>
    <span class="cursor">_</span>
  </div>
</footer>
